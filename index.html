<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webvander Studio</title>
    <style>
        body {
            background-color: #0a0e14;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 30px;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            box-shadow: inset 0 0 120px #1137c1;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        .logo {
            width: 100px;
            margin-bottom: 2rem; 
            filter: drop-shadow(0 0 15px #00f2ff);
        }

        .button-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 90%;
            max-width: 400px;
        }

        .btn {
            padding: 18px;
            text-align: center;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            background: #161b22;
            border: 1px solid #30363d;
            transition: all 0.3s ease;
            cursor: pointer;
            font-size: 16px;
            display: block;
            box-sizing: border-box;
        }

        .btn:hover {
            box-shadow: 0 0 20px #00f2ff;
            border-color: #00f2ff;
        }

        .btn:active {
            box-shadow: 0 0 30px #00f2ff !important;
            transform: scale(0.98);
        }

        .slogan {
            color: #ffffff;
            font-size: 0.9rem;
            text-align: center;
            margin: 20px;
            font-style: italic;
            opacity: 0.8;
            text-transform: uppercase;
        }

        .dev-wrapper {
            position: relative;
            margin-top: -10px;
            display: flex;
            justify-content: center;
        }

        .dev-glow {
            position: absolute;
            top: 60%;
            width: 120px;
            height: 120px;
            background: #00f2ff;
            filter: blur(60px);
            opacity: 0.2;
            z-index: 0;
            pointer-events: none;
        }

        .dev-image {
            width: 200px;
            position: relative;
            z-index: 1;
            display: block;
            -webkit-mask-image: linear-gradient(to bottom, black 80%, transparent 100%);
            mask-image: linear-gradient(to bottom, black 80%, transparent 100%);
        }

        @media (max-width: 480px) {
            .logo { 
                width: 80px; 
                margin-bottom: 1.5rem; 
            }
            .dev-image { 
                width: 180px; 
            }
        }
    </style>
</head>
<body>

    <img src="favicon-removebg-preview.webp" class="logo" alt="Logo Webvander Studio">

    <div class="button-container">
        <a href="https://webvanderagencia.vercel.app/" target="_blank" rel="noopener noreferrer" class="btn">
            Conhecer Projetos<br>(Webvander Studio)
        </a>
        <a href="javascript:void(0)" onclick="enviarWhatsApp()" class="btn">
            Quero falar com o Dev
        </a>
    </div>

    <p class="slogan">Sua marca, elevada ao nível de autoridade absoluta.</p>

    <div class="dev-wrapper">
        <div class="dev-glow"></div>
        <img src="Screenshot_20260218-130338-removebg-preview.webp" class="dev-image" alt="Desenvolvedor">
    </div>

    <script>
        function enviarWhatsApp() {
            const numero = "5532998698926";
            const mensagem = "Olá! Gostaria de falar sobre um projeto.";
            window.location.href = `https://wa.me/${numero}?text=${encodeURIComponent(mensagem)}`;
        }
    </script>
</body>
</html>
