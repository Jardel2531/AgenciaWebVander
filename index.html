<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webvander Studio</title>
    <style>
        body {
            background-color: #0a0e14;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 50px; 
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            box-shadow: inset 0 0 120px #1137c1;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        .logo {
            width: 100px;
            margin-bottom: 3rem; 
            filter: drop-shadow(0 0 15px #00f2ff);
        }

        .button-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 90%;
            max-width: 400px;
        }

        .btn {
            padding: 18px;
            text-align: center;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            background: #161b22;
            border: 1px solid #30363d;
            transition: 0.3s;
            cursor: pointer;
            line-height: 1.4;
            font-size: 16px;
        }

        .btn:hover {
            box-shadow: 0 0 20px #00f2ff;
            border-color: #00f2ff;
        }

        /* Estilo do novo slogan */
        .slogan {
            color: #ffffff;
            font-size: 0.9rem;
            text-align: center;
            margin: 30px 20px;
            font-style: italic;
            opacity: 0.8;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .dev-wrapper {
            position: relative;
            margin-top: 10px;
        }

        .dev-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 150px;
            height: 150px;
            background: #00f2ff;
            filter: blur(50px);
            opacity: 0.3;
            transform: translate(-50%, -50%);
            z-index: 0;
        }

        .dev-image {
            width: 200px;
            position: relative;
            z-index: 1;
        }

        @media (max-width: 480px) {
            .logo { width: 80px; }
            .btn { padding: 14px; font-size: 14px; }
            .dev-image { width: 160px; }
            .slogan { font-size: 0.8rem; }
        }
    </style>
</head>
<body>

    <img src="favicon-removebg-preview.webp" class="logo" alt="Logo">

    <div class="button-container">
        <a href="https://webvanderagencia.vercel.app/" target="_blank" class="btn">
            Conhecer Projetos<br>(Webvander Studio)
        </a>
        
        <a href="#" onclick="enviarWhatsApp()" class="btn">
            Quero falar com o Dev
        </a>
    </div>

    <p class="slogan">Sua marca, elevada ao nível de autoridade absoluta.</p>

    <div class="dev-wrapper">
        <div class="dev-glow"></div>
        <img src="Screenshot_20260218-130338-removebg-preview.webp" class="dev-image" alt="Desenvolvedor">
    </div>

    <script>
        function enviarWhatsApp() {
            const numero = "5532998698926";
            const mensagem = "Olá! Gostaria de falar sobre um projeto.";
            window.location.href = `https://wa.me/${numero}?text=${encodeURIComponent(mensagem)}`;
    }
</script>
